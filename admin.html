<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Admin — Lírio Estética</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"><link rel="icon" href="logo.png"><style>:root{--cacau:#4a2a1c;--ouro:#b98f3e;--ouro2:#e3c77e;--rose:#f6e8e2;--bg:#fcf7f4;--ameixa:#7b4a5a;--tx:#3a2a24}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 1rem/1.5 'Jost',system-ui,sans-serif}
main{max-width:900px;margin:auto;padding:12px}
.card{background:#fff;border:1px solid #efdfd7;border-radius:16px;padding:12px;margin:8px 0}
h2,h3,h4{font-family:'Cormorant Garamond',serif;color:var(--cacau);font-weight:600}h3{font-size:1.6rem}
nav{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:8px}small{color:#85716a}a{color:var(--ameixa)}
button{padding:10px 20px;border:1px solid var(--cacau);border-radius:999px;background:var(--cacau);color:#fff;cursor:pointer;margin:3px;font:500 .95rem 'Jost',sans-serif}
button.alt{background:#fff;color:var(--cacau);border-color:var(--ouro2)}
button.sel{background:var(--cacau);color:#fff;border-color:var(--cacau)}
button:hover{border-color:var(--ouro)}
:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}
input,textarea,select{padding:10px 14px;border:1px solid #e6d3ca;border-radius:12px;background:#fff;font:inherit;color:var(--tx);margin:4px 0}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ouro);box-shadow:0 0 0 3px rgba(185,143,62,.2)}
</style></head><body><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://rolktniycdayacfnolgs.supabase.co', SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvbGt0bml5Y2RheWFjZm5vbGdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NzYxOTYsImV4cCI6MjEwODQ1MjE5Nn0.VghfS6uowqYgvHSsuN9Cy6euxFTNqpwHgJpyfS0cE8A';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s), A=$('#app'), D={};
const FOTO=p=>`${SUPABASE_URL}/storage/v1/object/public/fotos/${p}`;
const add=(t,m)=>{const x=+t.slice(0,2)*60+ +t.slice(3,5)+m;return String(x/60|0).padStart(2,'0')+':'+String(x%60).padStart(2,'0')};
// só mantém horários de início em que cabem os horários seguidos exigidos pela duração do serviço
function inicios(l,dur){return l.filter((h,i)=>{let a=h.duracao_min,nx=add(h.hora,h.duracao_min);for(let j=i+1;a<dur;j++){const n=l[j];if(!n||n.data!=h.data||n.hora.slice(0,5)!=nx)return false;a+=n.duracao_min;nx=add(n.hora,n.duracao_min)}return true})}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fd=d=>new Date(d+'T12:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});
const opt=(l,k='nome')=>l.map(x=>`<option value="${x.id}">${esc(x[k])}</option>`).join('');
let tab='agenda';
const T={agenda,horarios,servicos,equipe,novo,config};
const NAMES={agenda:'Agenda',horarios:'Horários',servicos:'Serviços',equipe:'Equipe',novo:'Novo agendamento',config:'Site'};

(async()=>{const{data:{session}}=await db.auth.getSession();session?shell():login()})();
function login(){A.innerHTML=`<div class=card><img src=logo.png alt='' style='height:90px;border-radius:50%'><h2>Admin Lírio Estética</h2><input id=em placeholder=E-mail><input id=pw type=password placeholder=Senha><button onclick=entrar()>Entrar</button> <span id=msg></span></div>`}
async function entrar(){const{error}=await db.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});error?$('#msg').textContent=error.message:shell()}
function shell(){A.innerHTML=`<img src=logo.png alt='' style='height:72px;border-radius:50%;display:block;margin:6px 0'><nav>${Object.keys(T).map(k=>`<button class="alt" onclick="tab='${k}';go()">${NAMES[k]}</button>`).join('')}<button onclick="db.auth.signOut().then(login)">Sair</button></nav><div id=c></div>`;go()}
const go=()=>T[tab]();
async function load(){D.sv=(await db.from('servicos').select('*').order('nome')).data||[];D.pf=(await db.from('profissionais').select('*').order('nome')).data||[]}

// ---------- AGENDA ----------
async function agenda(){
 const fs=$('#fs')?.value||'';
 const{data,error}=await db.from('agendamentos').select('*,horarios(data,hora,profissionais(nome)),servicos(nome,preco)');
 if(error)return $('#c').innerHTML=error.message;
 const l=(data||[]).filter(a=>!fs||a.status==fs).sort((a,b)=>((b.horarios?.data||'')+(b.horarios?.hora||'')).localeCompare((a.horarios?.data||'')+(a.horarios?.hora||'')));
 $('#c').innerHTML=`<h3>Agendamentos</h3><select id=fs onchange=agenda()><option value="">Todos</option>${['pendente','confirmado','concluido','cancelado'].map(s=>`<option ${s==fs?'selected':''}>${s}</option>`).join('')}</select>`+
 l.map(a=>{const h=a.horarios,tel=a.cliente_telefone.replace(/\D/g,'');return `<div class=card><b>${esc(a.cliente_nome)}</b> — ${esc(a.servicos?.nome||'?')} ${brl(a.servicos?.preco)}<br>
 ${h?fd(h.data)+' '+h.hora.slice(0,5)+' • '+esc(h.profissionais?.nome):'sem horário'} <small>(${a.origem})</small><br>
 <small>${esc(a.cliente_telefone)} ${esc(a.observacoes)}</small><br>
 <select onchange="setSt('${a.id}',this.value)">${['pendente','confirmado','concluido','cancelado'].map(s=>`<option ${s==a.status?'selected':''}>${s}</option>`).join('')}</select>
 <a href="https://wa.me/55${tel}" target=_blank>WhatsApp</a></div>`}).join('')||'<p>Nada por aqui.</p>'}
async function setSt(id,s){const{data:a}=await db.from('agendamentos').select('horario_id,horarios_ids').eq('id',id).single();
 await db.from('agendamentos').update({status:s}).eq('id',id);
 const ids=(a.horarios_ids?.length?a.horarios_ids:[a.horario_id]).filter(Boolean);
 if(ids.length)await db.from('horarios').update({status:s=='cancelado'?'livre':'reservado'}).in('id',ids);agenda()}

// ---------- CRUD genérico (serviços / equipe) ----------
const row=(t,o,f,x='')=>`<div class=card data-t=${t} data-id="${o.id||''}" data-foto="${o.foto_path||''}">${f.map(k=>`<input data-f=${k} placeholder=${k} value="${esc(o[k])}" ${/preco|duracao|ordem/.test(k)?'type=number step=any':''}>`).join('')}${x}<label><input type=checkbox data-f=ativo ${o.ativo!==false?'checked':''}> ativo</label> <button onclick=salvar(this)>Salvar</button>${o.id?`<button class=alt onclick=excluir(this)>Excluir</button>`:''}</div>`;
async function salvar(b){const r=b.closest('.card'),p={};
 r.querySelectorAll('[data-f]').forEach(i=>p[i.dataset.f]=i.type=='checkbox'?i.checked:i.type=='number'?(i.value===''?0:+i.value):(i.value===''&&/_id$/.test(i.dataset.f)?null:i.value));
 const q=db.from(r.dataset.t);const{error}=r.dataset.id?await q.update(p).eq('id',r.dataset.id):await q.insert(p);error?alert(error.message):go()}
async function excluir(b){const r=b.closest('.card');if(!confirm('Excluir?'))return;if(r.dataset.foto)await db.storage.from('fotos').remove([r.dataset.foto]);const{error}=await db.from(r.dataset.t).delete().eq('id',r.dataset.id);error?alert(error.message):go()}
async function servicos(){await load();D.ct=(await db.from('categorias').select('*').order('ordem').order('nome')).data||[];
 const f=['nome','descricao','preco','duracao_min'];
 const x=o=>`<select data-f=categoria_id><option value="">Sem categoria</option>${D.ct.map(c=>`<option value="${c.id}" ${c.id==o.categoria_id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select><input data-f=etiqueta placeholder="etiqueta (ex.: mais pedido)" value="${esc(o.etiqueta)}">`+
  (o.id?`<div><small>Foto (reduzida sozinha para ~120 KB):</small> ${o.foto_path?`<img src="${FOTO(o.foto_path)}" height=56 style="border-radius:10px;vertical-align:middle"> <button class=alt onclick="tiraFoto('${o.id}')">Remover foto</button>`:''}<input type=file accept="image/*" onchange="foto('${o.id}',this)"></div>`:'<div><small>Salve o serviço para poder adicionar a foto.</small></div>');
 $('#c').innerHTML=`<h3>Categorias</h3>`+D.ct.map(c=>row('categorias',c,['nome','ordem'])).join('')+row('categorias',{},['nome','ordem'])+
 `<h3>Serviços e valores</h3>`+D.sv.map(s=>row('servicos',s,f,x(s))).join('')+`<h4>Novo serviço</h4>`+row('servicos',{},f,x({}))}
async function equipe(){await load();D.ps=(await db.from('profissional_servicos').select('*')).data||[];const f=['nome','especialidade'];
 $('#c').innerHTML=`<h3>Equipe</h3>`+D.pf.map(s=>row('profissionais',s,f)).join('')+`<h4>Nova profissional</h4>`+row('profissionais',{},f)+
 `<h3>Quem faz o quê</h3><small>Sem nenhum serviço marcado, a profissional aparece para todos os serviços.</small>`+
 D.pf.map(p=>`<div class=card><b>${esc(p.nome)}</b><br>${D.sv.map(s=>`<label style="margin-right:12px"><input type=checkbox ${D.ps.some(x=>x.profissional_id==p.id&&x.servico_id==s.id)?'checked':''} onchange="mapPs('${p.id}','${s.id}',this.checked)"> ${esc(s.nome)}</label>`).join('')}</div>`).join('')}
async function mapPs(p,s,on){const q=db.from('profissional_servicos');const{error}=on?await q.insert({profissional_id:p,servico_id:s}):await q.delete().eq('profissional_id',p).eq('servico_id',s);if(error)alert(error.message)}
// ---- fotos: reduz no navegador (máx. 800px, ≤120 KB, webp) antes de enviar ----
const toBlob=(c,t,q)=>new Promise(r=>c.toBlob(r,t,q));
async function comprimir(file){const bmp=await createImageBitmap(file);
 for(const m of [800,600,480]){const k=Math.min(1,m/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');
  c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  for(let q=.8;q>=.4;q-=.1){let b=await toBlob(c,'image/webp',q);if(!b||b.type!='image/webp')b=await toBlob(c,'image/jpeg',q);if(b&&b.size<=122880)return b}}
 return null}
async function foto(id,inp){const f=inp.files[0];if(!f)return;if(f.size>15e6)return alert('Imagem muito grande (máx. 15 MB).');
 let b;try{b=await comprimir(f)}catch(e){return alert('Arquivo de imagem inválido.')}
 if(!b)return alert('Não consegui reduzir esta foto. Tente outra.');
 const s=D.sv.find(x=>x.id==id),path=`servicos/${id}-${Date.now()}.${b.type=='image/webp'?'webp':'jpg'}`;
 const{error}=await db.storage.from('fotos').upload(path,b,{contentType:b.type,cacheControl:'31536000'});if(error)return alert(error.message);
 if(s.foto_path)await db.storage.from('fotos').remove([s.foto_path]);
 await db.from('servicos').update({foto_path:path}).eq('id',id);servicos()}
async function tiraFoto(id){const s=D.sv.find(x=>x.id==id);if(!s.foto_path||!confirm('Remover a foto?'))return;
 await db.storage.from('fotos').remove([s.foto_path]);await db.from('servicos').update({foto_path:null}).eq('id',id);servicos()}

// ---------- HORÁRIOS ----------
async function horarios(){await load();const hp=D.hp||D.pf[0]?.id;
 $('#c').innerHTML=`<h3>Criar horários em lote</h3><div class=card><select id=gp>${opt(D.pf)}</select><br>De <input type=date id=d1> até <input type=date id=d2><br>Das <input type=time id=h1 value=09:00> às <input type=time id=h2 value=18:00> a cada <input type=number id=iv value=60 style="width:70px"> min<br><label><input type=checkbox id=dom checked> pular domingos</label> <button onclick=gerar()>Gerar</button></div>
 <h3>Horários cadastrados</h3><select id=hp onchange="D.hp=this.value;horarios()">${opt(D.pf)}</select><div id=hl></div>`;
 if(hp){$('#hp').value=hp;$('#gp').value=hp;
  const{data}=await db.from('horarios').select('*').eq('profissional_id',hp).gte('data',new Date().toLocaleDateString('sv')).order('data').order('hora');
  $('#hl').innerHTML=(data||[]).map(h=>`<div class=card>${fd(h.data)} ${h.hora.slice(0,5)} — <b>${h.status}</b> ${h.status!='reservado'?`<button class=alt onclick="tg('${h.id}','${h.status=='livre'?'bloqueado':'livre'}')">${h.status=='livre'?'Bloquear':'Liberar'}</button><button class=alt onclick="dl('${h.id}')">Excluir</button>`:''}</div>`).join('')}}
async function gerar(){const p=$('#gp').value,a=$('#d1').value,b=$('#d2').value||a,iv=+$('#iv').value||60;if(!p||!a)return alert('Informe profissional e data.');
 const[h1,m1]=$('#h1').value.split(':').map(Number),[h2,m2]=$('#h2').value.split(':').map(Number),rows=[];
 for(let d=new Date(a+'T12:00');d<=new Date(b+'T12:00');d.setDate(d.getDate()+1)){
  if($('#dom').checked&&d.getDay()==0)continue;
  for(let m=h1*60+m1;m<h2*60+m2;m+=iv)rows.push({profissional_id:p,duracao_min:iv,data:d.toLocaleDateString('sv'),hora:String(m/60|0).padStart(2,'0')+':'+String(m%60).padStart(2,'0')})}
 const{error}=await db.from('horarios').upsert(rows,{onConflict:'profissional_id,data,hora',ignoreDuplicates:true});
 error?alert(error.message):(D.hp=p,horarios())}
async function tg(id,s){await db.from('horarios').update({status:s}).eq('id',id);horarios()}
async function dl(id){await db.from('horarios').delete().eq('id',id);horarios()}

// ---------- NOVO AGENDAMENTO MANUAL ----------
async function novo(){await load();
 $('#c').innerHTML=`<h3>Agendamento manual</h3><div class=card><select id=ns onchange=nh()>${opt(D.sv)}</select><select id=np onchange=nh()><option value="">Profissional</option>${opt(D.pf)}</select><select id=nh><option value="">Horário (opcional)</option></select><br>
 <input id=nn placeholder=Nome><input id=nt placeholder=Telefone><input id=no placeholder=Observações><br><button onclick=addMan()>Salvar</button></div>`}
async function nh(){const p=$('#np').value;if(!p)return;const dur=D.sv.find(x=>x.id==$('#ns').value)?.duracao_min||60;
 const{data}=await db.from('horarios').select('*').eq('profissional_id',p).eq('status','livre').gte('data',new Date().toLocaleDateString('sv')).order('data').order('hora');
 $('#nh').innerHTML='<option value="">Sem horário (opcional)</option>'+inicios(data||[],dur).map(h=>`<option value="${h.id}">${fd(h.data)} ${h.hora.slice(0,5)}</option>`).join('')}
async function addMan(){const h=$('#nh').value||null,b={p_servico:$('#ns').value,p_nome:$('#nn').value,p_tel:$('#nt').value,p_obs:$('#no').value};
 const r=h?await db.rpc('agendar',{...b,p_horario:h,p_origem:'manual',p_status:'confirmado'}):
  await db.from('agendamentos').insert({servico_id:b.p_servico,cliente_nome:b.p_nome,cliente_telefone:b.p_tel,observacoes:b.p_obs,status:'confirmado',origem:'manual'});
 if(r.error)return alert(r.error.message);alert('Salvo!');tab='agenda';go()}

// ---------- CONFIG DO SITE ----------
async function config(){const{data}=await db.from('configuracoes').select('*').eq('id',1).single();
 const L={nome:'Nome da clínica',subtitulo:'Subtítulo',boas_vindas:'Texto de boas-vindas',whatsapp:'WhatsApp (só números, com 55)',endereco:'Endereço',aviso:'Aviso / política'};
 $('#c').innerHTML=`<h3>Textos do site</h3><div class=card>`+Object.keys(L).map(k=>`<label>${L[k]}<br><input id=cf_${k} style="width:100%" value="${esc(data?.[k])}"></label><br>`).join('')+`<button onclick=salvaCfg()>Salvar</button></div>`}
async function salvaCfg(){const p={};['nome','subtitulo','boas_vindas','whatsapp','endereco','aviso'].forEach(k=>p[k]=$('#cf_'+k).value);
 const{error}=await db.from('configuracoes').update(p).eq('id',1);alert(error?error.message:'Salvo!')}
</script></body></html>
